name: Conventional commits

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository tooling
        run: npm ci

      - name: Lint commits and pull request title
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            npx --no -- commitlint --from "$merge_base" --to "$HEAD_SHA"
            printf '%s\n' "$PR_TITLE" > /tmp/pr-title.txt
            npx --no -- commitlint --edit /tmp/pr-title.txt
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            npx --no -- commitlint --last
          elif git merge-base "$BEFORE_SHA" "$AFTER_SHA" >/dev/null 2>&1; then
            npx --no -- commitlint --from "$BEFORE_SHA" --to "$AFTER_SHA"
          else
            npx --no -- commitlint --last
          fi
