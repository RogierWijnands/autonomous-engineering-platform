name: Conventional commits

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository tooling
        run: npm ci

      - name: Lint commits and pull request title
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            npx --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
            printf '%s\n' "$PR_TITLE" > /tmp/pr-title.txt
            npx --no -- commitlint --edit /tmp/pr-title.txt
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            npx --no -- commitlint --last
          else
            npx --no -- commitlint --from "$BEFORE_SHA" --to "$AFTER_SHA"
          fi

  pr-source-branch:
    name: PR source branch policy
    if: github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'develop')
    runs-on: ubuntu-latest
    steps:
      - name: Require a feature branch source
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^feature/.+ ]]; then
            echo "Pull requests targeting main or develop must come from a feature/* branch."
            exit 1
          fi
